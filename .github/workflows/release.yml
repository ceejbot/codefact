name: release
permissions:
    "contents": "write"

on:
    push:
        branches: [latest]
        tags:
            - "v**[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    release:
        name: release
        runs-on: ubuntu-latest
        steps:
            - uses: ceejbot/actions-rust-releaser@latest
              with:
                  executable: codefact
                  refname: ${{ github.ref_name }}
                  tap_repo: ceejbot/homebrew-tap
                  tap_email: ceejceej@gmail.com
                  tap_user: formula robot
